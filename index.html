<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정규식 & 단어 교환 텍스트 변환기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
        }

        /* ── 텍스트 영역 확장 (모바일) ── */
        .textarea-wrap { position: relative; }

        .expand-btn {
            display: none; /* 데스크탑에서는 숨김 */
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(59, 130, 246, 0.75);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            z-index: 10;
        }
        .expand-btn:hover { background: rgba(59, 130, 246, 1); }

        @media (max-width: 767px) {
            .expand-btn { display: block; }

            .mobile-textarea {
                height: 130px;
                transition: height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .mobile-textarea.expanded { height: 300px; }
        }
        @media (min-width: 768px) {
            .mobile-textarea { height: 240px; }
        }

        /* ── 규칙 행 반응형 ── */
        .rule-row {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .rule-inputs { display: flex; gap: 0.5rem; flex: 1; min-width: 0; }
        .rule-controls { display: flex; gap: 0.5rem; align-items: center; }

        @media (min-width: 640px) {
            .rule-row { flex-direction: row; align-items: center; }
            .rule-controls { flex-shrink: 0; }
        }

        /* ── 대소문자 토글 버튼 ── */
        .case-btn {
            padding: 0.4rem 0.65rem;
            border-radius: 0.5rem;
            font-size: 0.78rem;
            font-weight: 700;
            border: 1px solid #3f3f3f;
            background: #2a2a2a;
            color: #888;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1.4;
        }
        .case-btn:hover { border-color: #3b82f6; color: #60a5fa; }
        .case-btn.active {
            border-color: #3b82f6;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-4xl bg-[#1e1e1e] p-4 md:p-6 rounded-xl shadow-xl border border-[#2d2d2d]">
        <h1 class="text-xl font-bold mb-6 text-white flex items-center gap-2">
            ✨ 텍스트 변환 &amp; 상호 교환기
        </h1>

        <!-- ── 입력 / 출력 영역 ── -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium mb-1.5 text-gray-400">원본 텍스트 입력</label>
                <div class="textarea-wrap">
                    <textarea id="inputText"
                        class="mobile-textarea w-full p-4 bg-[#2a2a2a] border border-[#3f3f3f] rounded-lg text-white focus:outline-none focus:border-blue-500 resize-none"
                        placeholder="여기에 변환할 텍스트를 붙여넣으세요..."></textarea>
                    <button class="expand-btn" onclick="toggleExpand('inputText', this)">▼ 펼치기</button>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5 text-gray-400">변환된 결과</label>
                <div class="textarea-wrap">
                    <textarea id="outputText" readonly
                        class="mobile-textarea w-full p-4 bg-[#252525] border border-[#353535] rounded-lg text-gray-300 focus:outline-none resize-none"
                        placeholder="변환 버튼을 누르면 결과가 여기에 표시됩니다..."></textarea>
                    <button class="expand-btn" onclick="toggleExpand('outputText', this)">▼ 펼치기</button>
                </div>
            </div>
        </div>

        <!-- ── 변환 규칙 ── -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium text-gray-400">변환 규칙 설정 <span class="text-gray-600 text-xs font-normal">(정규식 및 상호 교환 가능)</span></span>
                <button onclick="addRule()"
                    class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded transition">
                    + 규칙 추가
                </button>
            </div>

            <div id="rulesContainer" class="space-y-2 max-h-72 overflow-y-auto pr-1">
                <!-- 규칙 행은 JS로 생성 -->
            </div>

            <!-- 범례 -->
            <p class="text-xs text-gray-600 mt-2">
                <span class="font-bold text-gray-500">Aa</span> 버튼을 누르면 해당 규칙에서 대소문자를 구분하지 않고 변환합니다.
            </p>
        </div>

        <!-- ── 액션 버튼 ── -->
        <div class="flex gap-3">
            <button onclick="convertText()"
                class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-lg">
                텍스트 변환하기
            </button>
            <button onclick="copyToClipboard()"
                class="px-5 py-3 bg-zinc-700 hover:bg-zinc-600 text-white font-semibold rounded-lg transition">
                결과 복사
            </button>
        </div>
    </div>

    <script>
        /* ────────────────────────────────────────
           초기 규칙 데이터
        ──────────────────────────────────────── */
        const initialRules = [
            { a: 'NPC',    b: 'PC',   mode: 'swap',    ci: false },
            { a: '롤플레잉', b: '대화', mode: 'replace', ci: false },
            { a: 'rp',     b: '대화', mode: 'replace', ci: false },
        ];

        /* ────────────────────────────────────────
           규칙 행 DOM 생성
        ──────────────────────────────────────── */
        function createRuleRow({ a = '', b = '', mode = 'replace', ci = false } = {}) {
            const row = document.createElement('div');
            row.className = 'rule-row';

            row.innerHTML = `
                <!-- 입력 (단어 A / 단어 B) -->
                <div class="rule-inputs">
                    <input type="text"
                        class="find-input flex-1 min-w-0 p-2.5 bg-[#2a2a2a] border border-[#3f3f3f] rounded-lg text-white placeholder-gray-500 text-sm focus:outline-none focus:border-blue-500"
                        placeholder="단어 A" value="${escapeHtml(a)}">
                    <input type="text"
                        class="replace-input flex-1 min-w-0 p-2.5 bg-[#2a2a2a] border border-[#3f3f3f] rounded-lg text-white placeholder-gray-500 text-sm focus:outline-none focus:border-blue-500"
                        placeholder="단어 B" value="${escapeHtml(b)}">
                </div>

                <!-- 컨트롤 (모드 / 대소문자 / 삭제) -->
                <div class="rule-controls">
                    <select class="mode-select flex-1 sm:flex-none bg-[#2a2a2a] border border-[#3f3f3f] text-gray-300 rounded-lg p-2.5 text-sm font-bold appearance-none cursor-pointer focus:outline-none focus:border-blue-500" style="min-width:88px;padding-right:1.8rem;">
                        <option value="swap"    ${mode === 'swap'    ? 'selected' : ''}>⇄ 교환</option>
                        <option value="replace" ${mode === 'replace' ? 'selected' : ''}>➔ 치환</option>
                    </select>

                    <button
                        class="case-btn${ci ? ' active' : ''}"
                        data-ci="${ci}"
                        title="대소문자 구분 없이 변환"
                        onclick="toggleCase(this)">Aa</button>

                    <button onclick="deleteRule(this)"
                        class="p-2 text-gray-400 hover:text-red-500 transition flex-shrink-0" title="삭제">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            `;
            return row;
        }

        /* ────────────────────────────────────────
           유틸
        ──────────────────────────────────────── */
        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function escapeRegExp(s) {
            return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        /* ────────────────────────────────────────
           규칙 추가 / 삭제
        ──────────────────────────────────────── */
        function addRule() {
            document.getElementById('rulesContainer').appendChild(createRuleRow());
        }

        function deleteRule(btn) {
            btn.closest('.rule-row').remove();
        }

        /* ────────────────────────────────────────
           대소문자 토글
        ──────────────────────────────────────── */
        function toggleCase(btn) {
            const active = btn.dataset.ci === 'true';
            btn.dataset.ci = String(!active);
            btn.classList.toggle('active', !active);
        }

        /* ────────────────────────────────────────
           텍스트 영역 펼치기 / 접기 (모바일)
        ──────────────────────────────────────── */
        function toggleExpand(id, btn) {
            const ta = document.getElementById(id);
            const expanded = ta.classList.toggle('expanded');
            btn.textContent = expanded ? '▲ 접기' : '▼ 펼치기';
        }

        /* ────────────────────────────────────────
           핵심 변환 로직
        ──────────────────────────────────────── */
        function convertText() {
            let text = document.getElementById('inputText').value;
            const rows = document.querySelectorAll('.rule-row');

            rows.forEach(row => {
                const wordA = row.querySelector('.find-input').value;
                const wordB = row.querySelector('.replace-input').value;
                const mode  = row.querySelector('.mode-select').value;
                const ci    = row.querySelector('.case-btn').dataset.ci === 'true';
                const flags = 'g' + (ci ? 'i' : '');

                if (!wordA) return;

                if (mode === 'swap') {
                    if (!wordB) return;

                    // 긴 단어를 앞에 두어 부분 매칭 오인 방지
                    const sorted = [wordA, wordB].sort((a, b) => b.length - a.length);
                    const regex  = new RegExp(
                        `${escapeRegExp(sorted[0])}|${escapeRegExp(sorted[1])}`, flags
                    );

                    text = text.replace(regex, (match) => {
                        // 대소문자 무시 모드: 소문자로 비교
                        const cmp = ci ? match.toLowerCase() : match;
                        const keyA = ci ? wordA.toLowerCase() : wordA;
                        return cmp === keyA ? wordB : wordA;
                    });

                } else {
                    // 일반 치환 (정규식 지원)
                    try {
                        const regex = new RegExp(wordA, flags);
                        text = text.replace(regex, wordB);
                    } catch (e) {
                        // 정규식 오류 시 단순 문자열 치환으로 폴백
                        if (ci) {
                            const safeRegex = new RegExp(escapeRegExp(wordA), 'gi');
                            text = text.replace(safeRegex, wordB);
                        } else {
                            text = text.split(wordA).join(wordB);
                        }
                    }
                }
            });

            document.getElementById('outputText').value = text;
        }

        /* ────────────────────────────────────────
           클립보드 복사
        ──────────────────────────────────────── */
        function copyToClipboard() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) { alert('복사할 결과가 없습니다.'); return; }

            (navigator.clipboard
                ? navigator.clipboard.writeText(outputText.value)
                : Promise.reject()
            ).catch(() => {
                outputText.select();
                document.execCommand('copy');
            }).finally(() => alert('클립보드에 복사되었습니다!'));
        }

        /* ────────────────────────────────────────
           초기 규칙 렌더링
        ──────────────────────────────────────── */
        const container = document.getElementById('rulesContainer');
        initialRules.forEach(rule => container.appendChild(createRuleRow(rule)));
    </script>
</body>
</html>
